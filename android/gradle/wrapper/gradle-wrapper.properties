# PhoneVision Lab — Gradle Wrapper 配置
#
# 职责：指定本工程使用的 Gradle 版本与下载地址。
# 为什么这样设计：固定版本避免“我这台能跑你那里跑不了”；gradlew 首次运行会自动下载该版本。
# 初学者调试观察点：
#   - 首次运行 gradlew 需要联网下载 Gradle 发行版；网络慢时耐心等待。
#   - 若该版本已无法下载（被下线），改 distributionUrl 指向更新的版本即可。
#
# P0-5B：distributionSha256Sum 锁定 Gradle 8.7 官方校验值，防止下载被篡改。
# 校验值来源：https://services.gradle.org/distributions/gradle-8.7-bin.zip.sha256
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
distributionSha256Sum=d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
