# PhoneVision Lab — Gradle 全局配置
# 启用 AndroidX（依赖库使用 androidx.* 时必须开启，否则构建失败）
android.useAndroidX=true
# 使用 Jetifier 将旧 support 库迁移到 AndroidX（本项目无旧库，但开启更稳妥）
android.enableJetifier=true

# ---------------------------------------------------------------------
# JVM 与网络（V0-B 新增说明）
# ---------------------------------------------------------------------
# TFLite 依赖（org.tensorflow:tensorflow-lite）从 Google Maven 仓库拉取，
# Kotlin 编译也需要比默认更大的堆。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
#
# 如果构建报 "Connect to 127.0.0.1:<port> failed: Connection refused"，
# 说明当前环境配了指向本地代理的 systemProp.http(s).proxyHost/Port，
# 而该代理没在运行。解决方式（任选其一）：
#   1. 启动那个本地代理；
#   2. 在下面的 systemProp.* 改指向可用代理；
#   3. 注释掉代理配置让 Gradle 直连（国内网络建议配镜像，
#      见 android/RELEASE.md 的镜像仓库章节）。
# 本项目源码不写死代理地址，避免把开发者本机配置提交进仓库。
#
# 下面四项把"用户级 ~/.gradle/gradle.properties 里可能配置的本地代理"
# 显式清空：某些开发环境会留下指向已停止代理（如 127.0.0.1:8927）的配置，
# 导致依赖下载报 "Connection refused"。清空后 Gradle 直连仓库。
# 如果你确实需要代理，请改成你自己的可用代理地址，或删掉这四行继承全局配置。
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
