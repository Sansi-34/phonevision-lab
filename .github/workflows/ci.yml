# PhoneVision Lab — CI 工作流（Python 测试 / Android 构建 / 仓库静态检查）
#
# 用途：为 GitHub 开源发布做准备（P0-5B）。当前仓库尚无 remote，此工作流
# 尚未在 GitHub-hosted 上运行过；可先做本地静态验证（actionlint + SHA 审计，
# 见 scripts/validate_workflows.ps1 与 pc-client/tests/test_ci_workflows.py）。
#
# 安全约定：
#   - 顶层 permissions: contents: read（最小权限）。
#   - 不使用拉取请求目标事件、write-all 或非必要 id-token。
#   - checkout 用 persist-credentials: false（不向 PR 分支写回凭据）。
#   - 所有外部 Action 固定完整 40 位 commit SHA，并用 # vX.Y.Z 注释版本。
#   - 工作流内不含任何本机路径/用户名（CI 只运行在 GitHub-hosted runner）。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (Py3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pc-client dependencies
        working-directory: pc-client
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Byte-compile all Python sources
        working-directory: pc-client
        run: python -m compileall -q qt_client main.py legacy_main.py connection.py mjpeg_reader.py vision_modes.py app_model.py app_gui.py theme.py

      # 单进程内运行 unittest 并统计，分别报告 总/通过/失败/错误/跳过，
      # 不把 skip 当 pass（PASS = 总 - 失败 - 错误 - 跳过）。
      - name: Run unit tests (offscreen) with pass/skip accounting
        working-directory: pc-client
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import unittest, sys
          s = unittest.TestLoader().discover('tests', top_level_dir='tests', pattern='test*.py')
          r = unittest.TestResult()
          s.run(r)
          t = r.testsRun
          e = len(r.errors)
          f = len(r.failures)
          k = len(r.skipped)
          print('UNITTEST TOTAL=%d PASS=%d FAIL=%d ERROR=%d SKIP=%d' % (t, t - e - f - k, f, e, k))
          if e or f:
              for name, tb in r.failures + r.errors:
                  print('==== %s' % name)
                  print(tb)
              sys.exit(1)
          "

      - name: Entrypoint --help smoke (offscreen)
        working-directory: pc-client
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python main.py --help
          python legacy_main.py --help
          python -m qt_client.main --help

  web-tests:
    name: Web platform tests (Py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pc-client dependencies
        working-directory: pc-client
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      # web/server 直接 import pc-client 的 pvl_* 模块与 connection，因此测试必须在
      # 仓库根目录下跑，并让 PC_CLIENT 目录进入 sys.path（web/tests 自己处理）。
      - name: Run web tests
        run: python -m unittest discover -s web/tests -t web -v

  android-build:
    name: Android build (JDK17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-provider: basic

      - name: Build (lint, unit test, debug + unsigned release APK, unsigned AAB)
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install minimal test deps
        working-directory: pc-client
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt PyYAML

      - name: No local path / username leaks in tracked source
        run: |
          set -euo pipefail
          # 排除项：
          #   1. 本步自身（grep 模式里的盘符反斜杠字面量 / 本机用户名）。
          #   2. 测试文件（tests/ 里的防泄漏断言自身含本机用户名字面量，
          #      以及 test_mjpeg_reader.py 的样例路径——均属"检查泄漏的命令"，不是泄漏）。
          #   3. android/scripts/build_release_candidate.ps1 的 JAVA_HOME 提示文案
          #      （C: 反斜杠 Users 示例，非真实路径）。
          FOUND=$(git grep -nE 'D:\\\\|C:\\\\Users|22917|Sansi' -- '*.py' '*.ps1' '*.kts' '*.gradle' '*.spec' '*.yml' '*.yaml' \
            | grep -vE '^\.github/workflows/ci\.yml:.*git grep' \
            | grep -vE '^pc-client/tests/' \
            | grep -v '^android/scripts/build_release_candidate.ps1:.*JAVA_HOME' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::检测到本机路径/用户名泄漏"
            echo "$FOUND"
            exit 1
          fi
          echo "no local path / username leaks"

      - name: No signing key files tracked
        run: |
          set -euo pipefail
          FOUND=$(git ls-files '*.keystore' '*.jks' '*.p12' '*.pfx' '*.pem' '*.key')
          if [ -n "$FOUND" ]; then
            echo "::error::发现被跟踪的密钥文件"
            echo "$FOUND"
            exit 1
          fi
          echo "no signing key files tracked"

      - name: i18n key consistency tests (offscreen)
        working-directory: pc-client
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_i18n -v

      - name: License bundle tests (offscreen)
        working-directory: pc-client
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_frozen_resources tests.test_packaging_config -v

      - name: Workflow static tests (SHA audit / permissions / paths)
        working-directory: pc-client
        run: python -m unittest tests.test_ci_workflows -v
